name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish
        run: dotnet publish ClaimsApi/ClaimsApi.csproj --no-build -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claims-api
          path: ./publish

  deploy-qa:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://claims-api-jungah-qa.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: claims-api
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: claims-api-jungah-qa
          package: ./publish

      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors https://claims-api-jungah-qa.azurewebsites.net/health

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://claims-api-jungah-h3fre0dfd8asbeed.swedencentral-01.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: claims-api
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: claims-api-jungah
          package: ./publish

      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors https://claims-api-jungah-h3fre0dfd8asbeed.swedencentral-01.azurewebsites.net/health